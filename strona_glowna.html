<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8"/>
  <title>Rozgrywka</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <!-- Animowane orby w tle -->
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>

  <div class="tabs">
    <button class="active" onclick="showView('dodaj', this)">Dodaj rozgrywkę</button>
    <button onclick="showView('statystyki', this)">Statystyki</button>
  </div>

  <!-- WIDOK: Dodaj rozgrywkę -->
  <div id="dodaj" class="view active">
    <div class="section">
      <div class="left">

        <!-- FORMULARZ: Gra -->
        <form action="add.php" method="POST" class="game-box">
          <input type="text" name="nazwa_gry" placeholder="Nazwa gry..." required/>
          <input type="text" name="gatunek" placeholder="Gatunek"/>
          <input type="text" name="platforma" placeholder="Platforma"/>
          <input type="text" name="rok" placeholder="Rok wydania"/>
        </form>

        <div class="players-row">

          <!-- FORMULARZ: Gracz 1 -->
          <form action="add_gracz.php" method="POST" class="player-box">
            <input type="text" name="nazwa" placeholder="Nazwa osoby 1..."/>
            <input type="text" name="druzyna" placeholder="Drużyna"/>
            <input type="text" name="pozycja" placeholder="Pozycja"/>
            <input type="text" name="czas" placeholder="Czas gry"/>
            <input type="number" name="punkty" placeholder="punkty"/>
          </form>

          <!-- FORMULARZ: Gracz 2 -->
          <form action="add_gracz.php" method="POST" class="player-box">
            <input type="text" name="nazwa" placeholder="Nazwa osoby 2..."/>
            <input type="text" name="druzyna" placeholder="Drużyna"/>
            <input type="text" name="pozycja" placeholder="Pozycja"/>
            <input type="text" name="czas" placeholder="Czas gry"/>
            <input type="number" name="punkty" placeholder="punkty"/>
          </form>

          <!-- FORMULARZ: Gracz 3 -->
          <form action="add_gracz.php" method="POST" class="player-box">
            <input type="text" name="nazwa" placeholder="Nazwa osoby 3..."/>
            <input type="text" name="druzyna" placeholder="Drużyna"/>
            <input type="text" name="pozycja" placeholder="Pozycja"/>
            <input type="text" name="czas" placeholder="Czas gry"/>
            <input type="number" name="punkty" placeholder="punkty"/>
          </form>

        </div>

        <button type="submit" form="formularz-gra" class="add">Dodaj</button>
      </div>
    </div>
  </div>

  <!-- WIDOK: Statystyki -->
  <div id="statystyki" class="view">
    <form action="statystyki.php" method="GET" class="stats-search">
      <input type="text" name="szukaj" placeholder="Szukaj gry..."/>
    </form>

    <table>
      <thead>
        <tr>
          <th>Gracz</th>
          <th>Gra</th>
          <th>Punkty</th>
          <th>Data</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td colspan="4" style="text-align:center; padding: 24px;">Brak danych</td>
        </tr>
      </tbody>
    </table>
  </div>

  <script>
    function showView(id, btn) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      btn.classList.add('active');
    }
  </script>

</body>
</html>
