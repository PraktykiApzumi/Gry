<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8"/>
  <title>Rozgrywka</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <!-- Animowane orby w tle -->
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>

  <!-- Zakładki -->
  <div class="tabs">
    <button class="active" onclick="showView('dodaj', this)">Dodaj rozgrywkę</button>
    <button onclick="showView('statystyki', this)">Statystyki</button>
  </div>

  <!-- WIDOK: Dodaj rozgrywkę -->
  <div id="dodaj" class="view active">
    <div class="section">
      <div class="left">

        <div class="game-box">
          <input type="text" placeholder="Nazwa gry..."/>
          <input type="text" placeholder="podp1"/>
          <input type="text" placeholder="podp1"/>
          <input type="text" placeholder="podp1"/>
        </div>

        <div class="players-row">
          <div class="player-box">
            <input type="text" placeholder="Nazwa osoby 1..."/>
            <input type="text" placeholder="podp1"/>
            <input type="text" placeholder="podp1"/>
            <input type="text" placeholder="podp1"/>
            <input type="text" placeholder="punkty"/>
          </div>
          <div class="player-box">
            <input type="text" placeholder="Nazwa osoby 2..."/>
            <input type="text" placeholder="podp1"/>
            <input type="text" placeholder="podp1"/>
            <input type="text" placeholder="podp1"/>
            <input type="text" placeholder="punkty"/>
          </div>
          <div class="player-box">
            <input type="text" placeholder="Nazwa osoby n..."/>
            <input type="text" placeholder="podp1"/>
            <input type="text" placeholder="podp1"/>
            <input type="text" placeholder="podp1"/>
            <input type="text" placeholder="punkty"/>
          </div>
        </div>

        <button class="add">Dodaj</button>
      </div>
    </div>
  </div>

  <!-- WIDOK: Statystyki -->
  <div id="statystyki" class="view">
    <div class="stats-search">
      <input type="text" placeholder="Szukaj gry..."/>
    </div>

    <table>
      <thead>
        <tr>
          <th>Gracz</th>
          <th>Gra</th>
          <th>Punkty</th>
          <th>Data</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td colspan="4" style="text-align:center; padding: 24px;">Brak danych</td>
        </tr>
      </tbody>
    </table>
  </div>

  <script>
    function showView(id, btn) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      btn.classList.add('active');
    }
  </script>

</body>
</html>
