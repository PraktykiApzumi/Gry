<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8"/>
  <title>Gry - System wyników</title>
  <link rel="stylesheet" href="kolorki.css"/>
</head>
<body>

  <h1>System wyników</h1>

  <div class="tabs">
    <button onclick="showView('dodaj', this)" class="active">Dodaj rozgrywkę</button>
    <button onclick="showView('statystyki', this)">Statystyki</button>
  </div>

  <hr>

  <!-- WIDOK: Dodaj rozgrywkę -->
  <div id="dodaj" class="view active">

    <h2>Dodaj rozgrywkę</h2>

    <form action="add.php" method="POST" class="game-box">
      <p>Gra:</p>
      <input type="text" name="nazwa_gry" placeholder="Nazwa gry..." required/>
      <input type="number" name="max_graczy" placeholder="Maksymalna ilość graczy"/>
    </form>

    <br>

    <div class="players-row">

      <form action="add_gracz.php" method="POST" class="player-box">
        <p>Gracz 1:</p>
        <input type="text" name="nazwa" placeholder="Nazwa gracza"/>
        <input type="number" name="punkty" placeholder="Punkty"/>
      </form>

      <form action="add_gracz.php" method="POST" class="player-box">
        <p>Gracz 2:</p>
        <input type="text" name="nazwa" placeholder="Nazwa gracza"/>
        <input type="number" name="punkty" placeholder="Punkty"/>
      </form>

      <form action="add_gracz.php" method="POST" class="player-box">
        <p>Gracz 3:</p>
        <input type="text" name="nazwa" placeholder="Nazwa gracza"/>
        <input type="number" name="punkty" placeholder="Punkty"/>
      </form>

    </div>

    <br>
    <button class="btn-dodaj">Dodaj</button>

  </div>

  <!-- WIDOK: Statystyki -->
  <div id="statystyki" class="view">

    <h2>Statystyki</h2>

    <form action="statystyki.php" method="GET">
      <input type="text" name="szukaj" placeholder="Szukaj gry..."/>
      <button type="submit" class="btn-dodaj">Szukaj</button>
    </form>

    <br>

    <table>
      <tr>
        <th>Gracz</th>
        <th>Gra</th>
        <th>Punkty</th>
        <th>Data</th>
      </tr>
      <tr>
        <td colspan="4" style="text-align:center; color:#999;">Brak danych</td>
      </tr>
    </table>

  </div>

  <script>
    function showView(id, btn) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      btn.classList.add('active');
    }

    async function test()
    {
      fetch("api/player/player")
        .then(res => res.text())
        .then(data => console.log(data));
    }
    test();

  </script>

</body>
</html>
